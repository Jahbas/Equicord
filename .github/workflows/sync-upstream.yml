name: Sync Upstream

on:
    schedule:
        - cron: "0 */2 * * *"
    workflow_dispatch:

permissions:
    contents: write
    issues: write

jobs:
    sync:
        name: Sync from upstream
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Fetch upstream
              run: |
                  git remote add upstream https://github.com/Equicord/Equicord.git
                  git fetch upstream main

            - name: Merge upstream
              id: merge
              continue-on-error: true
              run: |
                  git merge upstream/main --no-edit

            - name: Push if merged
              if: steps.merge.outcome == 'success'
              run: git push origin main

            - name: Report conflict
              if: steps.merge.outcome == 'failure'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  CONFLICTS="$(git diff --name-only --diff-filter=U)"

                  BODY="Upstream merge failed due to conflicts in:
                  $(echo "$CONFLICTS" | sed 's/^/- /')

                  <details>
                  <summary>Your custom plugins that may need manual resolution</summary>

                  $(for f in $CONFLICTS; do
                    echo "### \`$f\`"
                    if git show :2:"$f" > /dev/null 2>&1 && git show :3:"$f" > /dev/null 2>&1; then
                      echo '```diff'
                      git diff :2:"$f" :3:"$f" || true
                      echo '```'
                    fi
                  done)
                  </details>

                  Run locally:
                  \`\`\`
                  cd Equicord
                  git fetch upstream main
                  git merge upstream/main
                  # resolve conflicts, then:
                  git push origin main
                  \`\`\`"

                  EXISTING=$(gh issue list --label "upstream-conflict" --state open --json number --jq '.[0].number')

                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create \
                          --title "Merge conflict with upstream" \
                          --body "$BODY" \
                          --label "upstream-conflict"
                  fi

                  echo "::notice::Merge conflict — issue created on the fork"

            - name: Commit and push if fast-forward
              if: steps.merge.outcome == 'success'
              run: |
                  if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
                      git push origin main
                  fi
