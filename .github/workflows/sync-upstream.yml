name: Sync Upstream

on:
    schedule:
        - cron: "0 */2 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync:
        name: Sync from upstream
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Record fork workflow revision
              id: fork
              run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Fetch upstream
              run: |
                  git remote add upstream https://github.com/Equicord/Equicord.git
                  git fetch upstream main

            - name: Merge upstream
              id: merge
              continue-on-error: true
              run: |
                  git merge upstream/main --no-edit

            - name: Preserve fork workflows
              if: steps.merge.outcome == 'success'
              run: |
                  if git diff --quiet "${{ steps.fork.outputs.revision }}" HEAD -- .github/workflows; then
                      echo "No upstream workflow changes to preserve."
                      exit 0
                  fi

                  git restore --source="${{ steps.fork.outputs.revision }}" --staged --worktree -- .github/workflows
                  git clean -fd -- .github/workflows
                  git add -A .github/workflows
                  if ! git diff --cached --quiet; then
                      git commit --amend --no-edit
                  fi

            - name: Push merged changes
              if: steps.merge.outcome == 'success'
              run: |
                  if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
                      git push origin main
                  fi

            - name: Report conflict
              if: steps.merge.outcome == 'failure'
              run: |
                  CONFLICTS="$(git diff --name-only --diff-filter=U)"

                  {
                      echo "## Upstream merge conflict"
                      echo
                      echo "The scheduled sync could not merge upstream/main into main. Conflicts:"
                      echo
                      echo "$CONFLICTS" | sed 's/^/- /'
                      echo
                      echo "Resolve locally with:"
                      echo
                      echo '```bash'
                      echo 'git fetch upstream main'
                      echo 'git merge upstream/main'
                      echo 'git push origin main'
                      echo '```'
                      echo
                      for f in $CONFLICTS; do
                          echo "### \`$f\`"
                          if git show :2:"$f" > /dev/null 2>&1 && git show :3:"$f" > /dev/null 2>&1; then
                              echo '```diff'
                              git diff :2:"$f" :3:"$f" || true
                              echo '```'
                          fi
                      done
                  } >> "$GITHUB_STEP_SUMMARY"

                  echo "::error::Upstream merge conflict. See the job summary for the affected files."
                  exit 1
